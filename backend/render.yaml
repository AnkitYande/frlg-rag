services:
  - type: web
    name: frlg-rag-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: chroma-data
      mountPath: /opt/render/project/src/data/chroma
      sizeGB: 1
